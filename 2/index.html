<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link rel="stylesheet" href="/2/style.css">
</head>

<body>
    <h2 class="text-[40px] p-5 text-light bg-purple-600 text-center">Hello, Tailwind</h2>
    <h2 class="text-[40px] p-5 mt-5 text-green-50 bg-purple-800  text-center">Hello, World</h2>

    <h2 class="text-center font-bold text-red-400 text-4xl">Layout using Flex</h2>

    <div class="my-5 flex md:gap-5 gap-25">

        <div
            class="w-50 h-50 border-5 border-green-900 rounded-[20px] max-xl:bg-white max-md:bg-red-800 max-lg:bg-green-400">
            <h3 class="font-medium text-2xl flex justify-center items-center h-full">Hello</h3>
        </div>
        <div
            class="w-50 h-50 border-5 border-green-900 rounded-[20px] max-xl:bg-white max-md:bg-red-800 max-lg:bg-green-400">
            <h3 class="font-medium text-2xl flex justify-center items-center h-full">Hello</h3>
        </div>
        <div
            class="w-50 h-50 border-5 border-green-900 rounded-[20px] max-xl:bg-white max-md:bg-red-800 max-lg:bg-green-400">
            <h3 class="font-medium text-2xl flex justify-center items-center h-full">Hello</h3>
        </div>
    </div>

    <h2 class="text-center font-bold text-red-400 text-4xl">Layout using Grid</h2>


    <div class="my-5 grid grid-cols-12 md:grid-cols-12 gap-4">

        <div
            class="md:col-span-6 col-span-2 w-full h-50 border-5 border-green-900 rounded-[20px] ">
            <h3 class="font-medium text-2xl  ">Hello</h3>
        </div>
        <div
            class="md:col-span-5 col-span-8 w-full h-50 border-5 border-green-900 rounded-[20px] ">
            <h3 class="font-medium text-2xl  h-full ">Hello</h3>
        </div>
        <div
            class="md:col-span-1 col-span-2 w-full h-50 border-5 border-green-900 rounded-[20px] ">
            <h3 class="font-medium text-2xl  ">Hello</h3>
        </div>
    </div>
</body>

</html>
